name: Stage to maven central without tagging or pushing to gradle plugin portal

on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode GPG key
      run: echo "${{ secrets.SIGNING_SECRET_KEY_RING_FILE }}" | base64 --decode > $HOME/secring.gpg

    - name: Create gradle.properties
      run: |
        mkdir -p ~/.gradle
        echo "signing.keyId=${{ secrets.SIGNING_KEY_ID }}" >> ~/.gradle/gradle.properties
        echo "signing.password=${{ secrets.SIGNING_PASSWORD }}" >> ~/.gradle/gradle.properties
        echo "signing.secretKeyRingFile=$HOME/secring.gpg" >> ~/.gradle/gradle.properties

    - name: Build with Gradle
      env:
        SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      run: ./gradlew --info --stacktrace build

    - name: Prepare Central bundle
      env:
        SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      run: ./gradlew --info --stacktrace prepareCentralBundle

    - name: Grant execute permission for upload script
      run: chmod +x .github/scripts/upload_central.sh
    - name: Upload bundle via Central Publisher API (USER_MANAGED)
      run: .github/scripts/upload_central.sh "build/central-bundle.zip"
      env:
        CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
