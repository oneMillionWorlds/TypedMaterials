name: Release to the gradle plugins portal

on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode GPG key
      run: echo "${{ secrets.SIGNING_SECRET_KEY_RING_FILE }}" | base64 --decode > $HOME/secring.gpg

    # These go in the user level gradle.properties; the project's gradle.properties is committed (by the version
    # increment below) so must never have secrets written into it
    - name: Create gradle.properties
      run: |
        mkdir -p ~/.gradle
        echo "signing.keyId=${{ secrets.SIGNING_KEY_ID }}" >> ~/.gradle/gradle.properties
        echo "signing.password=${{ secrets.SIGNING_PASSWORD }}" >> ~/.gradle/gradle.properties
        echo "signing.secretKeyRingFile=$HOME/secring.gpg" >> ~/.gradle/gradle.properties
        echo "gradle.publish.key=${{ secrets.GRADLE_PLUGIN_SIGNING_KEY_ID }}" >> ~/.gradle/gradle.properties
        echo "gradle.publish.secret=${{ secrets.GRADLE_PLUGIN_SIGNING_PASSWORD }}" >> ~/.gradle/gradle.properties

    - name: Build with Gradle
      env:
        SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      run: ./gradlew --info --stacktrace build

    - name: Publish package to Gradle plugin portal
      env:
        SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
      run: ./gradlew --info --stacktrace publishPlugins

    - name: Tag and update version
      run: |
        # Extract current version from gradle.properties
        VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
        echo "Current version: $VERSION"

        # Create and push the tag for the current version
        git tag "v$VERSION"
        git push origin "v$VERSION"

        # Increment version for the next cycle
        # If version has a pre-release like 3.0.1-alpha1, increment the trailing number -> 3.0.1-alpha2
        if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z]+[0-9]+$ ]]; then
          BASE="${VERSION%%-*}"
          SUFFIX="${VERSION#*-}"
          PREFIX="${SUFFIX%%[0-9]*}"
          NUMBER="${SUFFIX#$PREFIX}"
          NEW_NUMBER=$((10#$NUMBER + 1))
          NEW_VERSION="$BASE-$PREFIX$NEW_NUMBER"
        else
          # Fallback: bump the last numeric segment (patch)
          NEW_VERSION=$(echo $VERSION | awk -F. '{ $NF = $NF + 1; print $0 }' OFS='.')
        fi
        echo "New version: $NEW_VERSION"

        # Update gradle.properties with the new version
        sed -i "s/^version=.*/version=$NEW_VERSION/" gradle.properties

        # Commit the change
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add gradle.properties
        git commit -m "Increment version to $NEW_VERSION [skip ci]"

        # Push the commit
        git push origin HEAD:${{ github.ref }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
